<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paviliun 900 — CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafafa;--card:#fff;--border:#e8e8e8;--text:#1a1a1a;--muted:#888;--accent:#111;--accent-hover:#333;--danger:#dc3545;--success:#28a745;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.2rem;text-align:center;margin-bottom:.3rem}
.login-card p{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
.topbar{background:var(--accent);color:#fff;padding:0 2rem;height:56px;display:flex;align-items:center;gap:2rem;position:sticky;top:0;z-index:100}
.topbar h1{font-size:1rem;font-weight:600}
.topbar nav a{color:rgba(255,255,255,.6);text-decoration:none;font-size:.85rem;font-weight:500;padding:.4rem .8rem;border-radius:6px;transition:.2s}
.topbar nav a:hover,.topbar nav a.active{color:#fff;background:rgba(255,255,255,.1)}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.card h2{font-size:1rem;font-weight:600;margin-bottom:1.25rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.8rem;font-weight:500;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{background:var(--bg)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-accent:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}.btn-danger:hover{background:#c82333}
.btn-sm{padding:.35rem .7rem;font-size:.75rem}
label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem}
input,textarea,select{width:100%;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;transition:.15s;background:var(--bg)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:1rem}
.row{display:flex;gap:1rem}.row>*{flex:1}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.tag-avail{background:#d4edda;color:#155724}.tag-na{background:#f8d7da;color:#721c24}
.unit-row{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--border)}
.unit-row:last-child{border-bottom:none}
.unit-info strong{font-size:.9rem}.unit-info small{color:var(--muted);font-size:.8rem}
.actions{display:flex;gap:.4rem}
.img-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.img-grid label{position:relative;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
.img-grid input{position:absolute;top:4px;left:4px;width:auto;z-index:1}
.img-grid img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid transparent;transition:.15s}
.img-grid input:checked+img{border-color:var(--accent);opacity:1}
.img-grid img:hover{opacity:.7}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg);border:1px solid var(--border);padding:.25rem .6rem;border-radius:20px;font-size:.78rem;margin:2px}
.chip button{background:none;border:none;cursor:pointer;color:var(--danger);font-size:.9rem;padding:0 2px}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:2rem;text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);color:var(--accent);background:rgba(0,0,0,.02)}
.dropzone input{display:none}
.section-title{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:1.5rem 0 .75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.preview-img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.error{color:var(--danger);font-size:.8rem;margin-top:.5rem}
.price-input{display:flex;gap:.5rem;align-items:flex-end}
.price-input input{flex:1}
.price-input select{width:140px;flex:none}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);transform:translateY(10px);transition:transform .2s;max-height:85vh;display:flex;flex-direction:column}
.modal-overlay.show .modal-box{transform:translateY(0)}
.modal-box h3{font-size:.95rem;margin-bottom:1rem;flex-shrink:0}
.modal-box input[type=text],.modal-box input[type=password]{width:100%;margin-bottom:.5rem}
.modal-box .error{margin-top:.25rem}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;flex-shrink:0}
.pick-search{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:8px;font-size:.85rem;margin-bottom:.75rem;font-family:inherit}
.pick-search:focus{outline:none;border-color:var(--accent)}
.pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;overflow-y:auto;flex:1;padding:2px}
.pick-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1.5px solid var(--border);transition:.15s;font-size:.82rem;user-select:none}
.pick-item:hover{border-color:#bbb;background:#f9f9f9}
.pick-item.selected{border-color:var(--accent);background:#f0f0f0}
.pick-item input{display:none}
.pick-item .pick-icon{flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center}
#deploy-toast{display:none;position:fixed;top:70px;right:20px;background:#111;color:#fff;padding:1rem 1.5rem;border-radius:10px;z-index:999;max-width:400px;font-size:.85rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="login-page" class="login-wrap">
  <div class="login-card">
    <h1>Paviliun 900</h1>
    <p>CMS Admin Panel</p>
    <div class="field"><label>Password</label><input id="login-pass" type="password" placeholder="Masukkan password"></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center" onclick="doLogin()">Masuk</button>
    <div id="login-error" class="error"></div>
  </div>
</div>
<div id="app-page" style="display:none">
  <div class="topbar">
    <h1>Paviliun 900</h1>
    <nav><a href="#" data-page="units" class="active">Units</a><a href="#" data-page="homepage">Homepage</a><a href="#" data-page="media">Media</a></nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:.5rem">
      <button class="btn btn-sm" onclick="setupToken()" style="color:#fff;border-color:rgba(255,255,255,.3);background:transparent;font-size:.75rem" id="token-btn">🔑 Setup Token</button>
      <button class="btn btn-sm" onclick="deployLive()" style="background:#25D366;color:#fff;border-color:#25D366" id="deploy-btn">🚀 Deploy ke Live</button>
    </div>
  </div>
  <div id="deploy-toast"></div>
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Batal</button>
      <button class="btn btn-accent" id="modal-ok">OK</button>
    </div>
  </div>
</div>
  <div class="container">
    <div id="page-units" class="page active"></div>
    <div id="page-homepage" class="page"></div>
    <div id="page-media" class="page"></div>
  </div>
</div>
<script>
let AUTH='', units=[], settings={}, images=[];

// ── MODAL SYSTEM ──
function modalShow(title, bodyHTML, opts={}) {
  return new Promise(resolve => {
    const ov=document.getElementById('modal-overlay');
    document.getElementById('modal-title').textContent=title;
    document.getElementById('modal-body').innerHTML=bodyHTML;
    document.getElementById('modal-cancel').style.display=opts.confirm?'inline-flex':'none';
    document.getElementById('modal-ok').textContent=opts.okText||'OK';
    ov.classList.add('show');
    const first=ov.querySelector('input'); if(first) setTimeout(()=>first.focus(),100);
    function close(val){ov.classList.remove('show');document.removeEventListener('keydown',onKey);resolve(val)}
    function onKey(e){if(e.key==='Escape')close(null);if(e.key==='Enter')close(getVal())}
    function getVal(){const inp=ov.querySelector('#modal-input'); return inp?inp.value:(opts.confirm?true:null)}
    document.addEventListener('keydown',onKey);
    document.getElementById('modal-ok').onclick=()=>close(getVal());
    document.getElementById('modal-cancel').onclick=()=>close(null);
    ov.onclick=e=>{if(e.target===ov)close(null)};
  });
}
function mPrompt(title, placeholder='', def='') {
  return modalShow(title, `<input id="modal-input" placeholder="${placeholder}" value="${def}">`);
}
function mConfirm(msg) {
  return modalShow('Konfirmasi', `<p>${msg}</p>`, {confirm:true, okText:'Ya, Hapus'});
}
function mAlert(msg) {
  return modalShow('Info', `<p>${msg}</p>`, {okText:'OK'});
}
function mPromptMulti(fields) {
  const html=fields.map(f=>`<label style="margin-bottom:2px">${f.label}</label><input id="mp-${f.id}" placeholder="${f.placeholder||''}" value="${f.value||''}">`).join('');
  return modalShow(fields[0].title||'Isi Data', html).then(()=>{
    const r={}; fields.forEach(f=>{r[f.id]=document.getElementById('mp-'+f.id)?.value||''}); return r;
  });
}

// ── PRICE FORMATTER ──
function fmtInput(n){ return n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '' }
function unfmtInput(s){ return parseInt((s||'').replace(/\./g,''),10)||0 }
function bindPrice(el, val){
  el.value=fmtInput(val);
  el.setAttribute('data-raw',val||0);
  el.addEventListener('input',e=>{
    const pos=e.target.selectionStart;
    const prev=el.value;
    const raw=prev.replace(/\D/g,'');
    el.value=fmtInput(raw);
    el.setAttribute('data-raw', raw||'0');
    const diff=el.value.length-prev.length;
    el.setSelectionRange(pos+diff,pos+diff);
  });
}
function getRawPrice(){return parseInt(document.getElementById('fu-harga')?.getAttribute('data-raw')||'0',10)}

// ── AUTH ──
async function doLogin(){
  const pass=document.getElementById('login-pass').value;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
    const d=await r.json();
    if(d.ok){
      AUTH=d.token; sessionStorage.setItem('auth',AUTH);
      document.getElementById('login-page').style.display='none';
      document.getElementById('app-page').style.display='block';
      init();
    }else{document.getElementById('login-error').textContent=d.error||'Gagal login'}
  }catch(e){document.getElementById('login-error').textContent='Server error'}
}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
if(sessionStorage.getItem('auth')){
  AUTH=sessionStorage.getItem('auth');
  document.getElementById('login-page').style.display='none';
  document.getElementById('app-page').style.display='block';
  init();
}
function api(path,opts={}){
  const h={'Content-Type':'application/json','X-Auth-Token':AUTH,...(opts.headers||{})};
  return fetch(path,{...opts,headers:h}).then(r=>{if(r.status===401){sessionStorage.removeItem('auth');location.reload()}return r.json()});
}
function v(id){return document.getElementById(id)?.value||''}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function fmtRp(n){return n?new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n):'Rp 0'}

async function init(){
  [units,settings,images]=await Promise.all([api('/api/units'),api('/api/settings'),api('/api/images')]);
  renderUnits();renderHomepage();renderMedia();
  if(getToken())document.getElementById('token-btn').textContent='🔑 Token ✓';
}

document.querySelectorAll('[data-page]').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));
    a.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+a.dataset.page).classList.add('active');
  });
});

// ── UNITS PAGE ──
function renderUnits(){
  const el=document.getElementById('page-units');
  const sorted=[...units].sort((a,b)=>a.tag.localeCompare(b.tag));
  let h=`<div class="flex-between" style="margin-bottom:1.25rem"><h2 style="margin:0">Unit Sewa</h2><button class="btn btn-accent" onclick="editUnit()">+ Tambah Unit</button></div><div class="card">`;
  if(!sorted.length) h+='<p style="color:var(--muted)">Belum ada unit.</p>';
  sorted.forEach(u=>{
    const tag=u.tag==='Available'?'<span class="tag tag-avail">Available</span>':'<span class="tag tag-na">Not Available</span>';
    const img0=(u.gambar||[])[0];
    const price=fmtRp(u.harga)+(u.satuan?`/${u.satuan}`:'');
    h+=`<div class="unit-row"><div style="display:flex;align-items:center;gap:1rem">
      ${img0?`<img src="/img/units/${img0}" class="preview-img">`:''}
      <div class="unit-info"><strong>${u.judul}</strong> ${tag}<br><small>${price} · ${u.tamu} tamu · ${(u.gambar||[]).length} foto</small></div></div>
      <div class="actions"><button class="btn btn-sm" onclick="copyUnit(${u.id})" title="Duplikat">📋</button><button class="btn btn-sm" onclick="editUnit(${u.id})">Edit</button><button class="btn btn-sm btn-danger" onclick="delUnit(${u.id})">Hapus</button></div></div>`;
  });
  el.innerHTML=h+'</div>';
}

// ── COMMON ICONS LIBRARY ──
const KNOWN_FAC=[
  {n:'4 Bedrooms',i:'mdi:bed-outline'},{n:'3 Bedrooms',i:'mdi:bed-outline'},{n:'2 Bedrooms',i:'mdi:bed-outline'},
  {n:'2 Bathrooms',i:'teenyicons:bath-outline'},{n:'1 Bathroom',i:'teenyicons:bath-outline'},
  {n:'Smart TV',i:'pixelarticons:device-tv-smart'},{n:'Kitchen',i:'fa6-solid:kitchen-set'},
  {n:'Wifi',i:'iconoir:wifi'},{n:'Air Conditioning',i:'tabler:air-conditioning'},
  {n:'Free Washer',i:'fluent:washer-24-regular'},{n:'Free Parking',i:'ph:car'},
  {n:'Water Heater',i:'material-symbols:water-heater-outline'},{n:'Refrigerator',i:'ep:refrigerator'},
  {n:'Microwave',i:'material-symbols:microwave-outline'},{n:'Balcony',i:'mdi:balcony'},
  {n:'Swimming Pool',i:'mdi:pool'},{n:'Garden',i:'mdi:flower'},
];
const KNOWN_RULES=[
  {n:'No Smoking',i:'mdi:no-smoking'},{n:'No Pets',i:'mdi:paw-off-outline'},
  {n:'No Parties',i:'mdi:party-popper'},{n:'No Shoes',i:'mdi:shoe-sneaker-off'},
  {n:'Quiet Hours 10PM-7AM',i:'mdi:volume-off'},
  {n:'Check-in: 2:00 PM',i:'icon-park-outline:check-in'},{n:'Checkout: 12:00 PM',i:'ri:time-line'},
  {n:'8 guests maximum',i:'fluent:people-20-regular'},{n:'6 guests maximum',i:'fluent:people-20-regular'},
];

function renderIconPreview(ikon){return `<iconify-icon icon="${ikon}" width="16" height="16" style="vertical-align:middle"></iconify-icon>`}

async function pickFromList(title, allItems, selectedKeys) {
  const id='pick-'+Date.now();
  const grid=allItems.map(it => {
    const key=it.n+'||'+it.i;
    const sel=selectedKeys.has(key);
    return `<div class="pick-item${sel?' selected':''}" data-key="${esc(key)}" onclick="_pickToggle(this)">
      <input type="checkbox" data-pick value="${esc(it.n)}||${esc(it.i)}" ${sel?'checked':''}>
      <span class="pick-icon">${renderIconPreview(it.i)}</span>
      <span>${it.n}</span>
    </div>`;
  }).join('');
  const body=`<input class="pick-search" type="text" placeholder="Cari…" oninput="filterPick(this)">
    <div class="pick-grid" id="${id}">${grid}</div>
    <div style="text-align:right;margin-top:.5rem"><button class="btn btn-sm" onclick="addCustomPick('${id}')">+ Tambah Manual</button></div>`;
  // Toggle click on items
  window._pickToggle=function(el){
    const cb=el.querySelector('input');
    cb.checked=!cb.checked;
    el.classList.toggle('selected',cb.checked);
  };
  window._pickId=id;
  return modalShow(title, body, {okText:'Pilih', confirm:true})
    .then(ok => ok ? [...document.querySelectorAll(`#${id} input[data-pick]:checked`)].map(c => c.value) : null);
}
window.filterPick=function(inp){
  const q=inp.value.toLowerCase();
  document.querySelectorAll(`#${window._pickId} .pick-item`).forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';
  });
};
window.addCustomPick=function(gridId){
  const n=prompt('Nama:');
  if(!n)return;
  const i=prompt('Icon (iconify):','mdi:star-outline');
  if(!i)return;
  const key=n+'||'+i;
  const grid=document.getElementById(gridId);
  const div=document.createElement('div');
  div.className='pick-item selected';
  div.setAttribute('data-key',key);
  div.innerHTML=`<input type="checkbox" data-pick value="${esc(key)}" checked>
    <span class="pick-icon">${renderIconPreview(i)}</span>
    <span>${esc(n)}</span>`;
  div.setAttribute('onclick','_pickToggle(this)');
  grid.appendChild(div);
  grid.scrollTop=grid.scrollHeight;
};

function copyUnit(id){
  const src=units.find(x=>x.id===id);
  if(!src)return;
  const clone={...src, id:0, judul:src.judul+' (Copy)', gambar:[...src.gambar], fitur:[...src.fitur], fasilitas:src.fasilitas.map(f=>({...f})), rules:src.rules.map(r=>({...r}))};
  editUnit(0);
  // Pre-fill form with cloned data after render
  setTimeout(()=>{
    document.getElementById('fu-judul').value=clone.judul;
    document.getElementById('fu-satuan').value=clone.satuan||'malam';
    document.getElementById('fu-tamu').value=clone.tamu;
    document.getElementById('fu-tag').value=clone.tag;
    document.getElementById('fu-desc').value=clone.desc||'';
    document.getElementById('fu-detail').value=clone.detail||'';
    bindPrice(document.getElementById('fu-harga'), clone.harga||0);
    // Re-check gambar checkboxes
    document.querySelectorAll('input[name=imgs]').forEach(c=>{c.checked=(clone.gambar||[]).includes(c.value)});
    // Re-render fitur/fasilitas/rules
    document.getElementById('fitur-list').innerHTML=(clone.fitur||[]).map(f=>`<span class="chip">${esc(f)} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-fit value="${esc(f)}"></span>`).join('');
    document.getElementById('fac-list').innerHTML=(clone.fasilitas||[]).map(f=>`<span class="chip">${renderIconPreview(f.ikon)} ${f.nama} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-fn data-fi value="${f.nama}||${f.ikon}"></span>`).join('');
    document.getElementById('rule-list').innerHTML=(clone.rules||[]).map(r=>`<span class="chip">${renderIconPreview(r.ikon)} ${r.aturan} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-rn data-ri value="${r.aturan}||${r.ikon}"></span>`).join('');
  },50);
}

function editUnit(id){
  const u=id?units.find(x=>x.id===id):{id:0,judul:'',fitur:[],desc:'',detail:'',harga:0,satuan:'malam',tamu:'',tag:'Available',gambar:[],fasilitas:[],rules:[],order:[{detail:'Whatsapp',link:`https://wa.me/${settings.site?.whatsapp||''}`,ikon:'la:whatsapp'}]};
  const imgChecks=images.map(f=>`<label><input type="checkbox" name="imgs" value="${f}" ${(u.gambar||[]).includes(f)?'checked':''}><img src="/img/units/${f}"></label>`).join('');
  const fiturChips=(u.fitur||[]).map(f=>`<span class="chip">${esc(f)} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-fit value="${esc(f)}"></span>`).join('');
  const facs=(u.fasilitas||[]).map(f=>`<span class="chip">${renderIconPreview(f.ikon)} ${f.nama} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-fn data-fi value="${f.nama}||${f.ikon}"></span>`).join('');
  const rls=(u.rules||[]).map(r=>`<span class="chip">${renderIconPreview(r.ikon)} ${r.aturan} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-rn data-ri value="${r.aturan}||${r.ikon}"></span>`).join('');

  document.getElementById('page-units').innerHTML=`<div class="card">
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem">
      <button class="btn btn-sm" onclick="renderUnits()" style="flex:none">← Kembali</button>
      <h2 style="margin:0">${id?'Edit':'Tambah'} Unit</h2>
    </div>
    <div class="field"><label>Judul</label><input id="fu-judul" value="${esc(u.judul)}"></div>
    <div class="row"><div class="field"><label>Harga (Rp)</label><input id="fu-harga" type="text" inputmode="numeric" placeholder="1.000.000" style="font-variant-numeric:tabular-nums"></div>
    <div class="field"><label>Satuan</label><select id="fu-satuan"><option value="malam" ${u.satuan==='malam'?'selected':''}>/malam</option><option value="tahun" ${u.satuan==='tahun'?'selected':''}>/tahun</option><option value="bulan" ${u.satuan==='bulan'?'selected':''}>/bulan</option></select></div>
    <div class="field"><label>Tamu</label><input id="fu-tamu" type="number" value="${u.tamu}"></div>
    <div class="field"><label>Status</label><select id="fu-tag"><option ${u.tag==='Available'?'selected':''}>Available</option><option ${u.tag==='Not Available'?'selected':''}>Not Available</option></select></div></div>
    <div class="section-title">Fitur Badges <button class="btn btn-sm" onclick="addFitur()">+ Tambah</button></div>
    <div id="fitur-list">${fiturChips}</div>
    <div class="field" style="margin-top:1rem"><label>Deskripsi Singkat</label><textarea id="fu-desc">${esc(u.desc)}</textarea></div>
    <div class="field"><label>Detail Lengkap</label><textarea id="fu-detail" style="min-height:120px">${esc(u.detail)}</textarea></div>
    <div class="section-title">Foto Unit</div>
    <div style="margin-bottom:.75rem"><label class="btn btn-sm" style="cursor:pointer">📁 Upload Foto Baru<input type="file" id="fu-upload-input" multiple accept="image/*" style="display:none"></label></div>
    <div class="img-grid">${imgChecks||'<p style="color:var(--muted)">Upload foto atau pilih dari Media Library</p>'}</div>
    <div class="section-title">Fasilitas <button class="btn btn-sm" onclick="pickFac()">+ Pilih / Tambah</button></div>
    <div id="fac-list">${facs}</div>
    <div class="section-title">House Rules <button class="btn btn-sm" onclick="pickRule()">+ Pilih / Tambah</button></div>
    <div id="rule-list">${rls}</div>
    <div style="margin-top:1.5rem;display:flex;gap:.5rem">
      <button class="btn btn-accent" onclick="saveUnit(${id})">Simpan</button>
      <button class="btn" onclick="renderUnits()">Batal</button>
    </div></div>`;
  // Bind price formatter
  bindPrice(document.getElementById('fu-harga'), u.harga||0);
  // Upload handler
  const iu=document.getElementById('fu-upload-input');
  if(iu) iu.addEventListener('change',async e=>{
    if(!e.target.files.length)return;
    const fd=new FormData();for(const f of e.target.files) fd.append('files',f,f.name);
    await fetch('/api/upload',{method:'POST',headers:{'X-Auth-Token':AUTH},body:fd});
    images=await api('/api/images');
    editUnit(id);
  });
  // Inject iconify script if not loaded
  if(!document.querySelector('script[src*="iconify"]')){
    const s=document.createElement('script');s.src='https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js';document.head.appendChild(s);
  }
}

async function addFitur(){
  const n=await mPrompt('Tambah Fitur','contoh: 4 Bedrooms'); if(!n)return;
  document.getElementById('fitur-list').innerHTML+=`<span class="chip">${esc(n)} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-fit value="${esc(n)}"></span>`;
}

function getSelectedKeys(listId){
  const s=new Set();
  document.querySelectorAll(`#${listId} input`).forEach(h=>s.add(h.value));
  return s;
}
function getManualItems(listId, knownSet){
  // Items currently in list that aren't in the known checklist
  const manual=[];
  document.querySelectorAll(`#${listId} input`).forEach(h=>{
    if(!knownSet.has(h.value)) manual.push(h.value);
  });
  return manual;
}
function renderChips(listId, items, tag1, tag2){
  document.getElementById(listId).innerHTML=items.map(v=>{
    const[n,i]=v.split('||');
    return `<span class="chip">${renderIconPreview(i)} ${n} <button onclick="this.parentElement.remove()">×</button><input type="hidden" data-${tag1}n data-${tag1}i value="${n}||${i}"></span>`;
  }).join('');
}
function knownSet(items){return new Set(items.map(it=>it.n+'||'+it.i))}
function getCustomFac(){return (settings.customFasilitas||[]).map(s=>{const[n,i]=s.split('||');return{n,i}})}
function getCustomRules(){return (settings.customRules||[]).map(s=>{const[n,i]=s.split('||');return{n,i}})}
function mergeKnown(known, custom){return [...known, ...custom.filter(c=>!known.some(k=>k.n===c.n&&k.i===c.i))]}
function saveCustom(type, items){
  settings[type]=items;
  api('/api/settings',{method:'PUT',body:JSON.stringify(settings)});
}

async function pickFac(){
  const all=mergeKnown(KNOWN_FAC, getCustomFac());
  const known=all.length;
  const sel=getSelectedKeys('fac-list');
  const manual=getManualItems('fac-list', knownSet(all));
  const picked=await pickFromList('Pilih Fasilitas', all, sel);
  if(picked===null)return;
  // Save any new manual items to custom list
  const newCustom=[];
  picked.forEach(v=>{
    const[n,i]=v.split('||');
    if(!KNOWN_FAC.some(k=>k.n===n&&k.i===i) && !newCustom.includes(v)) newCustom.push(v);
  });
  const merged=[...(settings.customFasilitas||[]),...newCustom];
  const unique=[...new Set(merged)];
  saveCustom('customFasilitas', unique);
  renderChips('fac-list', [...manual,...picked], 'f', 'f');
}
async function pickRule(){
  const all=mergeKnown(KNOWN_RULES, getCustomRules());
  const sel=getSelectedKeys('rule-list');
  const manual=getManualItems('rule-list', knownSet(all));
  const picked=await pickFromList('Pilih House Rules', all, sel);
  if(picked===null)return;
  const newCustom=[];
  picked.forEach(v=>{
    const[n,i]=v.split('||');
    if(!KNOWN_RULES.some(k=>k.n===n&&k.i===i) && !newCustom.includes(v)) newCustom.push(v);
  });
  const merged=[...(settings.customRules||[]),...newCustom];
  const unique=[...new Set(merged)];
  saveCustom('customRules', unique);
  renderChips('rule-list', [...manual,...picked], 'r', 'r');
}

async function saveUnit(id){
  const imgs=[...document.querySelectorAll('input[name=imgs]:checked')].map(c=>c.value);
  const fitur=[...document.querySelectorAll('#fitur-list input[data-fit]')].map(h=>h.value);
  const facs=[...document.querySelectorAll('#fac-list input')].map(h=>{const[n,i]=h.value.split('||');return{nama:n,ikon:i}});
  const rls=[...document.querySelectorAll('#rule-list input')].map(h=>{const[n,i]=h.value.split('||');return{aturan:n,ikon:i}});
  const body={judul:v('fu-judul'),fitur,desc:v('fu-desc'),detail:v('fu-detail'),harga:getRawPrice(),satuan:v('fu-satuan'),tamu:v('fu-tamu'),tag:v('fu-tag'),gambar:imgs,fasilitas:facs,rules:rls,order:[{detail:'Whatsapp',link:`https://wa.me/${settings.site?.whatsapp||''}?text=Halo%20saya%20mau%20pesan%20airbnb%20Paviliun900`,ikon:'la:whatsapp'}]};
  if(id){await api(`/api/units/${id}`,{method:'PUT',body:JSON.stringify(body)})}
  else{await api('/api/units',{method:'POST',body:JSON.stringify(body)})}
  units=await api('/api/units');
  renderUnits();
}
async function delUnit(id){
  if(!await mConfirm('Hapus unit ini? Data tidak bisa dikembalikan.'))return;
  await api(`/api/units/${id}`,{method:'DELETE'});
  units=await api('/api/units');
  renderUnits();
}

// ── HOMEPAGE PAGE ──
function renderHomepage(){
  const s=settings, el=document.getElementById('page-homepage');
  const nearby=(s.location?.nearby||[]).map(t=>`<span class="chip">${t}<button onclick="this.parentElement.remove()">×</button></span>`).join('');
  const reviews=(s.reviews||[]).map(r=>`<span class="chip">${esc(r.author)}: ${esc(r.text).slice(0,30)}…<button onclick="this.parentElement.remove()">×</button><input type="hidden" data-rv value="${esc(r.text)}||${esc(r.author)}"></span>`).join('');
  const imgOpts=images.map(f=>`<option value="${f}" ${f===s.hero?.coverImage?'selected':''}>${f}</option>`).join('');
  const imgOpts2=images.map(f=>`<option value="${f}" ${f===s.about?.image?'selected':''}>${f}</option>`).join('');
  el.innerHTML=`<h2 style="margin-bottom:1.25rem">Pengaturan Homepage</h2>
    <div class="card"><h2>🌐 Site Info</h2>
      <div class="row"><div class="field"><label>Nama Situs</label><input id="hs-name" value="${esc(s.site?.name)}"></div>
      <div class="field"><label>WhatsApp (no kode negara)</label><input id="hs-wa" value="${esc(s.site?.whatsapp)}"></div></div>
      <div class="row"><div class="field"><label>Email</label><input id="hs-email" value="${esc(s.site?.email)}"></div>
      <div class="field"><label>Airbnb URL</label><input id="hs-airbnb" value="${esc(s.site?.airbnbUrl)}"></div></div>
    </div>
    <div class="card"><h2>🏠 Hero Section</h2>
      <div class="field"><label>Judul</label><input id="hh-title" value="${esc(s.hero?.title)}"></div>
      <div class="field"><label>Subtitle</label><input id="hh-sub" value="${esc(s.hero?.subtitle)}"></div>
      <div class="field"><label>Cover Image</label><select id="hh-img">${imgOpts}</select></div>
    </div>
    <div class="card"><h2>📝 About Section</h2>
      <div class="field"><label>Teks</label><textarea id="ha-text">${esc(s.about?.text)}</textarea></div>
      <div class="field"><label>Gambar</label><select id="ha-img">${imgOpts2}</select></div>
    </div>
    <div class="card"><h2>📍 Lokasi</h2>
      <div class="field"><label>Alamat</label><input id="hl-addr" value="${esc(s.location?.address)}"></div>
      <div class="field"><label>Google Maps Embed URL</label><textarea id="hl-map" style="min-height:60px">${esc(s.location?.mapEmbed)}</textarea></div>
      <div class="section-title">Tempat Terdekat</div>
      <div id="hl-nearby">${nearby}</div>
      <button class="btn btn-sm" onclick="addNearby()" style="margin-top:.5rem">+ Tambah</button>
    </div>
    <div class="card"><h2>⭐ Reviews</h2>
      <div id="hr-list">${reviews}</div>
      <button class="btn btn-sm" onclick="addReview()" style="margin-top:.5rem">+ Tambah Review</button>
    </div>
    <div class="card"><h2>📋 Footer</h2>
      <div class="field"><label>Warning Text</label><textarea id="hf-warn">${esc(s.footer?.warning)}</textarea></div>
    </div>
    <button class="btn btn-accent" onclick="saveSettings()">Simpan Semua Pengaturan</button>`;
}
async function addNearby(){const n=await mPrompt('Tempat Terdekat','contoh: 5 menit ke UGM');if(n)document.getElementById('hl-nearby').innerHTML+=`<span class="chip">${n}<button onclick="this.parentElement.remove()">×</button></span>`}
async function addReview(){
  const r=await mPromptMulti([{id:'author',label:'Nama Reviewer',title:'Tambah Review',placeholder:'Agung'},{id:'text',label:'Isi Review',placeholder:'Comfy place to stay!'}]);
  if(!r||!r.author||!r.text)return;
  document.getElementById('hr-list').innerHTML+=`<span class="chip">${r.author}: ${r.text.slice(0,30)}…<button onclick="this.parentElement.remove()">×</button><input type="hidden" data-rv value="${esc(r.text)}||${esc(r.author)}"></span>`;
}
async function saveSettings(){
  const s={site:{name:v('hs-name'),whatsapp:v('hs-wa'),email:v('hs-email'),airbnbUrl:v('hs-airbnb')},hero:{title:v('hh-title'),subtitle:v('hh-sub'),coverImage:v('hh-img')},about:{text:v('ha-text'),image:v('ha-img')},location:{address:v('hl-addr'),mapEmbed:v('hl-map'),nearby:[...document.querySelectorAll('#hl-nearby .chip')].map(c=>c.childNodes[0].textContent.trim())},reviews:[...document.querySelectorAll('#hr-list input[data-rv]')].map(h=>{const[t,a]=h.value.split('||');return{text:t,author:a}}),footer:{warning:v('hf-warn')}};
  await api('/api/settings',{method:'PUT',body:JSON.stringify(s)});settings=s;await mAlert('Pengaturan tersimpan!');
}

// ── MEDIA PAGE ──
function renderMedia(){
  const el=document.getElementById('page-media');
  const imgs=images.map(f=>`<div style="position:relative;display:inline-block;margin:4px">
    <img src="/img/units/${f}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">
    <button onclick="delImg('${f}')" style="position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:.7rem;cursor:pointer;line-height:1">×</button>
    <div style="font-size:.65rem;color:var(--muted);text-align:center;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f}</div></div>`).join('');
  el.innerHTML=`<h2 style="margin-bottom:1.25rem">Media Library</h2>
    <div class="card"><div class="dropzone" id="dz">
      <div style="font-size:2rem;margin-bottom:.5rem">📁</div>
      <strong>Drag & drop foto di sini</strong><br><small>atau klik untuk pilih file (bisa multi-select)</small>
      <input type="file" id="file-input" multiple accept="image/*">
    </div><div id="upload-status" style="margin-top:.5rem;font-size:.8rem"></div></div>
    <div class="card"><h2>Semua Foto (${images.length})</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${imgs||'<p style="color:var(--muted)">Belum ada foto</p>'}</div></div>`;
  const dz=document.getElementById('dz'),fi=document.getElementById('file-input');
  dz.addEventListener('click',()=>fi.click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');uploadFiles(e.dataTransfer.files)});
  fi.addEventListener('change',e=>{if(e.target.files.length)uploadFiles(e.target.files)});
}
async function uploadFiles(fileList){
  const fd=new FormData();for(const f of fileList) fd.append('files',f,f.name);
  document.getElementById('upload-status').innerHTML='⏳ Mengupload…';
  await fetch('/api/upload',{method:'POST',headers:{'X-Auth-Token':AUTH},body:fd});
  images=await api('/api/images');
  document.getElementById('upload-status').innerHTML=`✅ Terupload`;renderMedia();renderUnits();
}
async function delImg(name){
  if(!await mConfirm(`Hapus foto "${name}"?`))return;
  await api(`/api/images/${encodeURIComponent(name)}`,{method:'DELETE'});
  images=await api('/api/images');renderMedia();renderUnits();
}

// ── DEPLOY ──
function getToken(){return localStorage.getItem('gh_token')||''}
async function setupToken(){const t=await mPrompt('GitHub Personal Access Token','ghp_...',getToken());if(t){localStorage.setItem('gh_token',t);document.getElementById('token-btn').textContent='🔑 Token ✓'}}
async function deployLive(){
  const token=getToken();if(!token){setupToken();return}
  const btn=document.getElementById('deploy-btn'),toast=document.getElementById('deploy-toast');
  btn.disabled=true;btn.textContent='⏳ Deploying…';toast.style.display='block';toast.innerHTML='⏳ Committing & deploying…';
  try{
    const data=await api('/api/deploy',{method:'POST',body:JSON.stringify({token})});
    if(data.ok){toast.innerHTML='✅ <strong>Deployed!</strong><br><small style="color:#aaa">Live di paviliun900.com</small>';setTimeout(()=>toast.style.display='none',5000)}
    else{toast.innerHTML=`❌ <strong>Gagal</strong><br><pre style="font-size:.7rem;max-height:150px;overflow:auto;color:#ff6b6b">${(data.log||[]).join('\n')}</pre>`}
  }catch(e){toast.innerHTML=`❌ ${e.message}`}
  btn.disabled=false;btn.textContent='🚀 Deploy ke Live';
}
</script>
